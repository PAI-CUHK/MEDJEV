<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
  <title id="title">MEDJEV performance highlights</title>
  <desc id="desc">Three research-result panels: official MedNLI test accuracy, unseen runtime-query wording accuracy across three seeds, and the range of shared execution timing ratios.</desc>
  <style>
    .title { font: 700 30px Arial, Helvetica, sans-serif; fill: #103a43; }
    .subtitle { font: 16px Arial, Helvetica, sans-serif; fill: #61757d; }
    .panel-title { font: 700 19px Arial, Helvetica, sans-serif; fill: #103a43; }
    .label { font: 16px Arial, Helvetica, sans-serif; fill: #42616a; }
    .small { font: 14px Arial, Helvetica, sans-serif; fill: #61757d; }
    .value { font: 700 20px Arial, Helvetica, sans-serif; fill: #103a43; }
    .axis { font: 13px Arial, Helvetica, sans-serif; fill: #71858b; }
  </style>
  <rect width="1400" height="760" fill="#f7fbfa"/>
  <rect x="34" y="28" width="1332" height="704" rx="26" fill="#ffffff" stroke="#d4e5e3" stroke-width="2"/>
  <text x="72" y="80" class="title">MEDJEV performance highlights</text>
  <text x="72" y="111" class="subtitle">Archived research results · higher is better for accuracy, lower is better for NLL/ECE · not clinical validation</text>

  <g>
    <rect x="72" y="150" width="390" height="472" rx="18" fill="#f7fbfa" stroke="#d4e5e3" stroke-width="2"/>
    <text x="98" y="193" class="panel-title">Official MedNLI test</text>
    <text x="98" y="219" class="small">n = 1,422 · seed 17 · accuracy</text>
    <g stroke="#d6e4e2" stroke-width="1">
      <path d="M190 273v230M240 273v230M290 273v230M340 273v230M390 273v230"/>
    </g>
    <text x="98" y="328" class="label">Dynamic</text>
    <text x="98" y="418" class="label">Fixed control</text>
    <rect x="190" y="294" width="211" height="48" rx="8" fill="#0b9f95"/>
    <rect x="190" y="384" width="212" height="48" rx="8" fill="#1677a8"/>
    <text x="249" y="326" class="value">84.39%</text>
    <text x="250" y="416" class="value">84.81%</text>
    <g class="axis" text-anchor="middle">
      <text x="190" y="532">0</text><text x="240" y="532">20</text><text x="290" y="532">40</text><text x="340" y="532">60</text><text x="390" y="532">80</text>
    </g>
    <text x="421" y="532" class="axis">100%</text>
    <text x="98" y="575" class="small">Calibrated dynamic ECE: 1.41%</text>
    <text x="98" y="598" class="small">Dynamic - fixed: -0.42 pp</text>
  </g>

  <g>
    <rect x="505" y="150" width="390" height="472" rx="18" fill="#f7fbfa" stroke="#d4e5e3" stroke-width="2"/>
    <text x="531" y="193" class="panel-title">Unseen query wording</text>
    <text x="531" y="219" class="small">3 seeds · direct runtime-query accuracy</text>
    <g stroke="#d6e4e2" stroke-width="1">
      <path d="M623 273v230M673 273v230M723 273v230M773 273v230M823 273v230"/>
    </g>
    <text x="531" y="328" class="label">Control</text>
    <text x="531" y="418" class="label">MEDJEV v2</text>
    <rect x="623" y="294" width="163" height="48" rx="8" fill="#9ab7bd"/>
    <rect x="623" y="384" width="202" height="48" rx="8" fill="#0b9f95"/>
    <path d="M781 286v64M776 286h10M776 350h10" stroke="#103a43" stroke-width="3"/>
    <path d="M823 378v102M818 378h10M818 480h10" stroke="#103a43" stroke-width="3"/>
    <text x="790" y="326" class="value" text-anchor="end">70.63 +/- 2.12%</text>
    <text x="845" y="416" class="value" text-anchor="end">87.38 +/- 0.87%</text>
    <g class="axis" text-anchor="middle">
      <text x="623" y="532">0</text><text x="673" y="532">20</text><text x="723" y="532">40</text><text x="773" y="532">60</text><text x="823" y="532">80</text>
    </g>
    <text x="854" y="532" class="axis">100%</text>
    <text x="531" y="575" class="small">v2 - control: +16.75 pp</text>
    <text x="531" y="598" class="small">Unseen wording, not unseen medical task</text>
  </g>

  <g>
    <rect x="938" y="150" width="390" height="472" rx="18" fill="#f7fbfa" stroke="#d4e5e3" stroke-width="2"/>
    <text x="964" y="193" class="panel-title">Shared execution probe</text>
    <text x="964" y="219" class="small">96 queries · 12 paired conditions · median ratio</text>
    <text x="964" y="298" class="label">Fresh / shared time</text>
    <path d="M1024 365h250" stroke="#d6e4e2" stroke-width="8" stroke-linecap="round"/>
    <path d="M1086.5 365h142.5" stroke="#0b9f95" stroke-width="14" stroke-linecap="round"/>
    <circle cx="1086.5" cy="365" r="10" fill="#0b9f95"/>
    <circle cx="1229" cy="365" r="10" fill="#1677a8"/>
    <text x="1086.5" y="329" class="value" text-anchor="middle">1.25x</text>
    <text x="1229" y="329" class="value" text-anchor="middle">1.82x</text>
    <g class="axis" text-anchor="middle">
      <text x="1024" y="401">1.0x</text><text x="1086.5" y="401">1.25x</text><text x="1149" y="401">1.5x</text><text x="1211.5" y="401">1.75x</text><text x="1274" y="401">2.0x</text>
    </g>
    <text x="964" y="470" class="small">Observed shared-path category flip rate:</text>
    <text x="964" y="495" class="value">0.00% - 2.08%</text>
    <text x="964" y="548" class="small">BF16 backend comparison; not p95 latency</text>
    <text x="964" y="571" class="small">and not a production throughput guarantee</text>
  </g>

  <text x="72" y="679" class="small">Sources: archived RESULTS_REPORT.md and V2_COMPARISON_REPORT.md. Full datasets, weights, and raw run artifacts remain external.</text>
  <text x="72" y="703" class="small">All comparisons are scope-limited; confidence intervals and known negative results are documented in docs/benchmarks.md.</text>
</svg>
