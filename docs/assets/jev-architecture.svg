<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
  <title id="title">MEDJEV JEV-inspired architecture</title>
  <desc id="desc">A left-to-right architecture diagram showing query inputs, semantic encoders, candidate-conditioned scoring, calibration, and an auditable runtime result.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#123b43" flood-opacity=".12"/>
    </filter>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0 0 12 6 0 12z" fill="#0a8d8d"/>
    </marker>
    <style>
      .heading { font: 700 30px Arial, Helvetica, sans-serif; fill: #103a43; }
      .label { font: 700 22px Arial, Helvetica, sans-serif; fill: #103a43; }
      .body { font: 17px Arial, Helvetica, sans-serif; fill: #42616a; }
      .small { font: 15px Arial, Helvetica, sans-serif; fill: #61757d; }
      .mono { font: 16px 'Courier New', monospace; fill: #15545a; }
    </style>
  </defs>
  <rect width="1400" height="760" fill="#f7fbfa"/>
  <rect x="40" y="34" width="1320" height="692" rx="28" fill="#ffffff" stroke="#d4e5e3" stroke-width="2"/>
  <text x="82" y="92" class="heading">MEDJEV / JEV-inspired evidence decision architecture</text>
  <text x="82" y="124" class="body">A candidate-query contract keeps meaning, scoring, calibration, and audit scope explicit.</text>

  <g filter="url(#shadow)">
    <rect x="82" y="186" width="220" height="202" rx="18" fill="#e7f7f4" stroke="#8ed8cd" stroke-width="2"/>
    <rect x="334" y="186" width="220" height="202" rx="18" fill="#eef6fc" stroke="#9fc8e5" stroke-width="2"/>
    <rect x="586" y="186" width="238" height="202" rx="18" fill="#fff5df" stroke="#e9c675" stroke-width="2"/>
    <rect x="856" y="186" width="210" height="202" rx="18" fill="#f3edfb" stroke="#cdb8e7" stroke-width="2"/>
    <rect x="1098" y="186" width="220" height="202" rx="18" fill="#eef8ed" stroke="#add69f" stroke-width="2"/>
  </g>

  <g fill="none" stroke="#0a8d8d" stroke-width="4" marker-end="url(#arrow)">
    <path d="M302 287h28"/>
    <path d="M554 287h28"/>
    <path d="M824 287h28"/>
    <path d="M1066 287h28"/>
  </g>

  <g>
    <text x="106" y="230" class="label">1. Query contract</text>
    <text x="106" y="264" class="body">Record + statement</text>
    <text x="106" y="290" class="body">+ candidate meaning set</text>
    <text x="106" y="333" class="mono">Query(...)</text>
    <text x="106" y="360" class="small">IDs are unique and ordered</text>

    <text x="358" y="230" class="label">2. Encoders</text>
    <text x="358" y="264" class="body">Evidence representation</text>
    <text x="358" y="290" class="body">Candidate representation</text>
    <text x="358" y="333" class="mono">encode(record)</text>
    <text x="358" y="360" class="small">Shared context is preserved</text>

    <text x="610" y="230" class="label">3. Decision head</text>
    <text x="610" y="264" class="body">Candidate-conditioned</text>
    <text x="610" y="290" class="body">relationship scores</text>
    <text x="610" y="333" class="mono">logits[candidate]</text>
    <text x="610" y="360" class="small">Permutation-aware scoring</text>

    <text x="880" y="230" class="label">4. Calibration</text>
    <text x="880" y="264" class="body">Normalize scores</text>
    <text x="880" y="290" class="body">record scope + status</text>
    <text x="880" y="333" class="mono">P(candidate | query)</text>
    <text x="880" y="360" class="small">Unknown schemas stay marked</text>

    <text x="1122" y="230" class="label">5. Result</text>
    <text x="1122" y="264" class="body">Prediction + probabilities</text>
    <text x="1122" y="290" class="body">backend + audit scope</text>
    <text x="1122" y="333" class="mono">DecisionResult</text>
    <text x="1122" y="360" class="small">Not a disease probability</text>
  </g>

  <rect x="82" y="454" width="1236" height="192" rx="18" fill="#103a43"/>
  <text x="116" y="500" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#ffffff">Runtime invariants under test</text>
  <g font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#d8f4ef">
    <text x="124" y="548">01  candidate permutation preserves meaning-to-score mapping</text>
    <text x="124" y="583">02  evidence masking and padding do not change valid outputs</text>
    <text x="124" y="618">03  calibration never reads the sealed evaluation split</text>
    <text x="756" y="548">04  independent queries cannot leak candidate context</text>
    <text x="756" y="583">05  unknown schemas are labeled uncalibrated</text>
    <text x="756" y="618">06  clinical use and benchmark accuracy remain separate</text>
  </g>
  <text x="82" y="686" class="small">Research software boundary: datasets, checkpoints, patient data, and credentials remain outside this repository.</text>
</svg>
