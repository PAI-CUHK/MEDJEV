<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">Preliminary MEDJEV benchmark snapshot</title>
  <desc id="desc">A bar chart showing dynamic candidate route accuracy of 84.39 percent and fixed-label control accuracy of 84.81 percent, labeled as a preliminary single-seed snapshot.</desc>
  <style>
    .title { font: 700 28px Arial, Helvetica, sans-serif; fill: #103a43; }
    .sub { font: 16px Arial, Helvetica, sans-serif; fill: #61757d; }
    .axis { font: 14px Arial, Helvetica, sans-serif; fill: #61757d; }
    .label { font: 700 17px Arial, Helvetica, sans-serif; fill: #103a43; }
    .value { font: 700 19px Arial, Helvetica, sans-serif; fill: #103a43; }
  </style>
  <rect width="1200" height="560" rx="24" fill="#ffffff"/>
  <rect x="24" y="24" width="1152" height="512" rx="18" fill="#f7fbfa" stroke="#d4e5e3" stroke-width="2"/>
  <text x="68" y="76" class="title">Preliminary evaluation snapshot</text>
  <text x="68" y="108" class="sub">Accuracy (%) · one fixed experiment configuration · not clinical validation</text>

  <g stroke="#d6e4e2" stroke-width="1">
    <path d="M330 154v260M465 154v260M600 154v260M735 154v260M870 154v260M1005 154v260"/>
    <path d="M330 414h675" stroke="#8ea9aa" stroke-width="2"/>
  </g>
  <g class="axis" text-anchor="middle">
    <text x="330" y="442">80</text><text x="465" y="442">81</text><text x="600" y="442">82</text>
    <text x="735" y="442">83</text><text x="870" y="442">84</text><text x="1005" y="442">85</text>
  </g>
  <text x="1008" y="468" class="axis" text-anchor="end">Accuracy (%)</text>

  <text x="68" y="238" class="label">Dynamic candidate route</text>
  <text x="68" y="277" class="label">Fixed-label control</text>
  <rect x="330" y="210" width="592.65" height="42" rx="8" fill="#0b9f95"/>
  <rect x="330" y="249" width="650.35" height="42" rx="8" fill="#1677a8"/>
  <text x="940" y="238" class="value">84.39%</text>
  <text x="998" y="277" class="value">84.81%</text>

  <rect x="68" y="482" width="16" height="16" rx="3" fill="#0b9f95"/>
  <text x="92" y="496" class="sub">Dynamic candidate route</text>
  <rect x="278" y="482" width="16" height="16" rx="3" fill="#1677a8"/>
  <text x="302" y="496" class="sub">Fixed-label control</text>
  <text x="1130" y="496" class="sub" text-anchor="end">Difference: -0.42 pp</text>
</svg>
