name: Feature request
description: Suggest a focused improvement to the research software.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
    validations:
      required: true
  - type: textarea
    id: research_impact
    attributes:
      label: Research and safety impact
      description: Explain effects on candidate semantics, calibration, data leakage, or clinical claims.
    validations:
      required: true
